	<script>
		function Card(name, categories, food){
			this.name = name

		function makeHTML(number, card){
			var newCard = document.createElement("div")
			newCard.className = "card"

			var n = document.createElement("div")
			n.className = "number"
			n.textContent = "~ "+number+" ~"

			newCard.appendChild(n)

			var name = document.createElement("div")
			name.className = "name"
			name.textContent = card.name

			newCard.appendChild(name)

			var meals = document.createElement("ul")
				meals.className = "meals"


			for (var i=0; i < card.categories.length; i++){
				
				var m = document.createElement("li")
				m.textContent = card.categories[i]
				meals.appendChild(m)

				var f = document.createElement("ul")
				f.className = "food"

				for (var j = 0; j< card.food[i].length; j++){
					var food = document.createElement("li")
					food.className = "food"
					food.textContent = card.food[i][j]
					f.appendChild(food)

				}

				meals.appendChild(f)

			}

			newCard.appendChild(meals)


			document.body.appendChild(newCard)

		}
